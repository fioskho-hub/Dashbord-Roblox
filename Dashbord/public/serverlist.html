<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroDash - Liste des Serveurs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="grid-container" class="grid-bg"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-chart-line"></i>
            <span>XeroDash</span>
        </div>
        <div class="nav-user">
            <span id="username">Chargement...</span>
            <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar">
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <h2>Sélectionnez un serveur</h2>
            <p>Choisissez le serveur Discord lié à votre jeu Roblox.</p>
        </div>

        <div id="servers-grid" class="servers-grid"></div>
    </main>

    <script src="../src/serverlist.js"></script>
</body>
</html>
